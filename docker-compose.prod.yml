services:
  db:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
    command: ["sh", "-c", "python infra/db/wait_for_postgres.py && python infra/db/init_db.py && uvicorn app.api.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    env_file:
      - .env

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - app
    command: ["streamlit", "run", "ui/home.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://app:8000
    env_file:
      - .env

volumes:
  pgdata:
